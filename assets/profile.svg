<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0F0F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A2E;stop-opacity:1" />
    </linearGradient>

    <rect id="rune" x="-15" y="-15" width="30" height="30" fill="none" stroke="#61DAFB" stroke-width="2" opacity="0.3">
        <animate attributeName="opacity" values="0.1;0.4;0.1" dur="8s" repeatCount="indefinite" />
    </rect>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="15" ry="15"/>

  <g id="background-anim">
     <g transform="translate(100, 650)">
      <use xlink:href="#rune">
          <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -700" dur="30s" repeatCount="indefinite" />
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="35s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
     <g transform="translate(400, 650)">
      <use xlink:href="#rune" stroke="#7536F6">
          <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -700" dur="25s" begin="5s" repeatCount="indefinite" />
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="30s" begin="5s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
    <g transform="translate(700, 650)">
      <use xlink:href="#rune" stroke="#FF3E00">
          <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -700" dur="35s" begin="2s" repeatCount="indefinite" />
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" begin="2s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
  </g>

  <g transform="translate(400, 40)" text-anchor="middle">

    <image x="-150" y="0" height="30" href="https://img.shields.io/badge/Open_Source_Contributions-151515?style=for-the-badge&logo=github&logoColor=white" />

    <g transform="translate(0, 50)">
        <a xlink:href="https://kestra.io" target="_blank">
            <image x="-240" y="0" height="28" href="https://img.shields.io/badge/Kestra-7536F6?style=for-the-badge&logo=kestra&logoColor=white"/>
        </a>
        <a xlink:href="https://reactbits.dev" target="_blank">
            <image x="-80" y="0" height="28" href="https://img.shields.io/badge/React_Bits-151515?style=for-the-badge&logo=react&logoColor=61DAFB"/>
        </a>
        <a xlink:href="https://github.com/jervw/dono" target="_blank">
             <image x="100" y="0" height="28" href="https://img.shields.io/badge/Dono_CLI-black?style=for-the-badge&logo=rust&logoColor=white"/>
        </a>
    </g>

    <image x="-75" y="110" height="30" href="https://img.shields.io/badge/My_Projects-151515?style=for-the-badge&logo=vercel&logoColor=white" alt="Projects" />

    <g transform="translate(0, 160)">
        <image x="-145" y="0" width="50" height="50" href="https://raw.githubusercontent.com/aighita/moji-db/main/assets/logo.svg" />
        <a xlink:href="https://moji.vercel.app" target="_blank">
             <image x="-60" y="11" height="28" href="https://img.shields.io/badge/Moji-Visit_App-black?style=for-the-badge&logo=vercel&logoColor=white" />
        </a>

        <g transform="translate(0, 70)">
             <image x="-145" y="0" width="50" height="50" href="https://raw.githubusercontent.com/aighita/coding-challenges/main/assets/circle.svg" />
             <a xlink:href="https://coding-challenges-seven.vercel.app" target="_blank">
                 <image x="-60" y="11" height="28" href="https://img.shields.io/badge/Coding_Challenges-Visit_App-black?style=for-the-badge&logo=vercel&logoColor=white" />
            </a>
        </g>
    </g>

    <image x="-75" y="330" width="150" href="https://raw.githubusercontent.com/aighita/aighita/main/assets/shinryu.svg" />

  </g>
</svg>
