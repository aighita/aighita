<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0b14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1c1c2e;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="rune" d="M0,0 L20,0 L20,20 L0,20 Z" fill="none" stroke="#38b2ac" stroke-width="1.5" opacity="0.4">
       <animateTransform attributeName="transform" type="rotate" from="0 10 10" to="360 10 10" dur="20s" repeatCount="indefinite"/>
    </path>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" rx="10" ry="10"/>

  <g>
    <use href="#rune" x="100" y="250" stroke="#7536F6">
      <animate attributeName="y" values="250;50" dur="15s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.5;0" dur="15s" repeatCount="indefinite" />
    </use>
    <use href="#rune" x="700" y="280" stroke="#FF3E00">
      <animate attributeName="y" values="280;30" dur="12s" begin="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.4;0" dur="12s" begin="2s" repeatCount="indefinite" />
    </use>
    <use href="#rune" x="400" y="300" stroke="#61DAFB">
      <animate attributeName="y" values="300;10" dur="20s" begin="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.3;0" dur="20s" begin="5s" repeatCount="indefinite" />
    </use>
  </g>

  <text x="50%" y="60%" text-anchor="middle" font-family="'Courier New', monospace" font-size="80" font-weight="bold" fill="#F05032" filter="url(#glow)" letter-spacing="10">
    深流
    <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite" />
  </text>
  
  <text x="50%" y="80%" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#8892b0" letter-spacing="4">
    FULL STACK DEVELOPER
  </text>
</svg>