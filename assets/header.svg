<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <style>
    /* Light mode - Default */
    .title { fill: #0f172a; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .subtitle { fill: #475569; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .btn-ring { stroke: #cbd5e1; }
    
    /* Dark mode - GitHub automatizează asta */
    @media (prefers-color-scheme: dark) {
      .title { fill: #f8fafc; }
      .subtitle { fill: #94a3b8; }
      .btn-ring { stroke: #475569; }
    }
  </style>

  <!-- Fundal transparent pentru a respecta dimensiunile -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Salutare -->
  <text x="50" y="80" class="title" font-size="22" font-weight="500">Hey 👋, I'm Julian</text>

  <!-- Titluri principale -->
  <text x="50" y="160" class="title" font-size="76" font-weight="700" letter-spacing="-2">Software Engineer</text>
  <text x="165" y="225" class="title" font-size="54" font-weight="400" letter-spacing="-1">Software Developer</text>

  <!-- Subtitlu -->
  <!-- <text x="130" y="300" class="subtitle" font-size="24">I build software that</text> -->
  <!-- <text x="50" y="340" class="subtitle" font-size="24">bridges the gap between ideas and reality.</text> -->

  <!-- Buton CTA -->
  <g transform="translate(50, 380)">
    <!-- Inelul exterior (Border-ul gri subtil din design) -->
    <rect x="-4" y="-4" width="168" height="58" rx="29" fill="none" class="btn-ring" stroke-width="2" />
    
    <!-- Fundalul butonului (Mereu alb) -->
    <rect x="0" y="0" width="160" height="50" rx="25" fill="#ffffff" />
    
    <!-- Iconița Mail -->
    <svg x="22" y="13" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
      <polyline points="22,6 12,13 2,6"></polyline>
    </svg>

    <!-- Text Buton -->
    <text x="58" y="31" fill="#000000" font-family="system-ui, sans-serif" font-size="18" font-weight="500">Portfolio</text>
  </g>
</svg>
